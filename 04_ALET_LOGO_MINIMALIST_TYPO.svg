<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tenor+Sans&amp;family=Plus+Jakarta+Sans:wght@500;700&amp;display=swap');
      .bg { fill: #F7D9BF; }
      .wordmark { font-family: 'Tenor Sans', serif; font-size: 82px; fill: #121214; letter-spacing: 0.42em; text-anchor: middle; font-weight: 400; }
      .tagline { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; fill: #52473E; letter-spacing: 0.55em; text-anchor: middle; font-weight: 600; }
      .accent-line { stroke: #121214; stroke-width: 1.5; opacity: 0.35; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="16"/>
  
  <!-- Minimalist Pure Luxury Wordmark -->
  <g transform="translate(415, 235)">
    <text x="0" y="0" class="wordmark">ALET</text>
    <line x1="-160" y1="40" x2="135" y2="40" class="accent-line"/>
    <text x="-12" y="75" class="tagline">BAGS &amp; CARRYING GOODS</text>
  </g>
</svg>
