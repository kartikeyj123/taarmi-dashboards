<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@500&amp;display=swap');
      .bg { fill: #121214; }
      .stroke-gold { fill: none; stroke: #C4B59D; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
      .wordmark { font-family: 'Cormorant Garamond', serif; font-size: 58px; fill: #FAF8F5; letter-spacing: 0.35em; text-anchor: middle; font-weight: 500; }
      .subline { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 12px; fill: #C4B59D; letter-spacing: 0.5em; text-anchor: middle; font-weight: 500; }
    </style>
  </defs>
  <rect width="100%" height="100%" class="bg" rx="16"/>
  
  <!-- Icon: Continuous Ribbon "A" Knot -->
  <g transform="translate(400, 155)">
    <path d="M -40 45 C -40 -35, 0 -55, 0 -55 C 0 -55, 40 -35, 40 45 C 40 10, -35 15, 45 15" class="stroke-gold" stroke-width="4.5"/>
    <circle cx="0" cy="-55" r="3.5" fill="#FAF8F5"/>
  </g>
  
  <!-- Primary Wordmark -->
  <text x="410" y="305" class="wordmark">ALET</text>
  
  <!-- Sub-label -->
  <text x="405" y="345" class="subline">ATELIER • PARIS &amp; JAIPUR</text>
</svg>
